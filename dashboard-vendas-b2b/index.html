<!DOCTYPE html>
<html lang="pt-BR" xmlns:mso="urn:schemas-microsoft-com:office:office" xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Análise Vendas B2B — Cabana Burger</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
:root{
  --brand:#1D9E75;--brand-d:#158a61;--brand-l:#e8f7f2;
  --bg:#f4f6f8;--sidebar:#1a1d2e;
  --white:#fff;--text:#1a2236;--text2:#5a6578;--text3:#8a95a3;
  --red:#e63946;--amber:#f4a261;--blue:#2563eb;--green:#16a34a;--purple:#8b5cf6;
  --border:#e2e8f0;--shadow:0 2px 8px rgba(0,0,0,.08);
  --radius:10px;--sidebar-w:210px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* SIDEBAR */
#sidebar{width:var(--sidebar-w);background:var(--sidebar);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;height:100%}
.sb-logo{padding:18px 16px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo .brand{font-size:17px;font-weight:700;color:#fff;display:flex;align-items:center}
.sb-logo .sub{font-size:12px;color:rgba(255,255,255,.35);margin-top:2px}
.sb-nav{padding:10px 0;flex:1}
.sb-section{font-size:11px;color:rgba(255,255,255,.28);padding:10px 16px 3px;text-transform:uppercase;letter-spacing:.8px}
.sb-item{display:flex;align-items:center;gap:9px;padding:9px 16px;cursor:pointer;color:rgba(255,255,255,.55);font-size:14px;transition:.15s;border-left:3px solid transparent}
.sb-item:hover{background:rgba(255,255,255,.05);color:#fff}
.sb-item.active{background:rgba(29,158,117,.15);color:var(--brand);border-left-color:var(--brand);font-weight:600}
.sb-item svg{width:15px;height:15px;flex-shrink:0}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;height:100%}
#topbar{background:var(--white);border-bottom:1px solid var(--border);padding:9px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.tb-title{font-size:16px;font-weight:700;color:var(--text);white-space:nowrap;flex-shrink:0}
.tb-pills{display:flex;flex:1;flex-wrap:wrap;gap:5px;align-items:center}
.active-pill{display:inline-flex;align-items:center;gap:4px;background:var(--brand-l);border:1px solid var(--brand);color:var(--brand);border-radius:20px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.tb-actions{display:flex;align-items:center;gap:7px;flex-shrink:0}
.btn-filter{display:flex;align-items:center;gap:6px;background:var(--sidebar);color:#fff;border:none;border-radius:7px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;position:relative}
.btn-filter:hover{background:#252840}
.btn-filter .badge-cnt{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.btn-reset{display:flex;align-items:center;gap:5px;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:5px 10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--text2);transition:.15s}
.btn-reset:hover{border-color:var(--red);color:var(--red)}

/* FILTER PANEL */
#filter-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;display:none;align-items:flex-start;justify-content:flex-end}
#filter-overlay.open{display:flex}
#filter-panel{width:380px;height:100%;background:var(--white);box-shadow:-4px 0 24px rgba(0,0,0,.15);display:flex;flex-direction:column;overflow:hidden}
.fp-header{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.fp-header h3{font-size:16px;font-weight:700}
.fp-close{width:28px;height:28px;border-radius:6px;background:var(--bg);border:none;cursor:pointer;font-size:17px;color:var(--text3)}
.fp-body{flex:1;overflow-y:auto;padding:16px 18px}
.fp-section{margin-bottom:18px}
.fp-section-title{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.date-row{display:flex;gap:8px;align-items:center}
.date-row input{flex:1;border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-size:14px;font-family:inherit;color:var(--text);background:var(--bg)}
.date-row span{font-size:13px;color:var(--text3)}
.quick-dates{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.quick-btn{padding:3px 9px;border:1px solid var(--brand);border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;color:var(--brand);background:var(--brand-l)}
.quick-btn:hover{background:var(--brand);color:#fff}
.ms-actions{display:flex;gap:14px;margin-bottom:6px}
.ms-actions span{font-size:12px;color:var(--brand);cursor:pointer;font-weight:600}
.ms-search{width:100%;border:1px solid var(--border);border-radius:7px;padding:6px 10px;font-size:13px;font-family:inherit;margin-bottom:8px;background:var(--bg)}
.check-list{max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:4px}
.check-item{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:13.5px}
.check-item:hover{background:var(--bg)}
.check-item input{accent-color:var(--brand);width:14px;height:14px;flex-shrink:0}
.fp-footer{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
.fp-apply{flex:1;padding:9px;background:var(--brand);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.fp-apply:hover{background:var(--brand-d)}
.fp-reset{padding:9px 16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--text2)}

/* CONTENT */
#content{flex:1;overflow-y:auto;padding:16px 18px}
.page-intro{font-size:12.5px;color:var(--text3);margin:-2px 0 12px;line-height:1.5}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi-card{background:var(--white);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);border-top:3px solid transparent}
.kpi-card.c-grn{border-top-color:var(--brand)}.kpi-card.c-blu{border-top-color:var(--blue)}.kpi-card.c-amb{border-top-color:var(--amber)}.kpi-card.c-pur{border-top-color:var(--purple)}.kpi-card.c-red{border-top-color:var(--red)}
.k-label{font-size:11px;color:var(--text3);font-weight:600;margin-bottom:3px;text-transform:uppercase;letter-spacing:.3px}
.k-value{font-size:22px;font-weight:700;color:var(--text);line-height:1.1}
.k-sub{font-size:12px;margin-top:3px;color:var(--text3)}
.k-sub.pos{color:var(--green)}.k-sub.neg{color:var(--red)}

/* CARD */
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px}
.card-header{padding:12px 14px 9px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.card-title{font-size:14px;font-weight:700;color:var(--text)}
.card-sub{font-size:11.5px;color:var(--text3);font-weight:400}
.card-body{padding:12px 14px}
.var-btns{display:flex;gap:3px}
.var-btn{padding:4px 9px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;background:var(--white);color:var(--text2);font-family:inherit}
.var-btn.active{background:var(--brand);color:#fff;border-color:var(--brand)}

/* TABLE */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{background:var(--sidebar);color:rgba(255,255,255,.85);font-size:11.5px;font-weight:600;padding:8px 10px;text-align:left;white-space:nowrap;position:sticky;top:0}
.data-table th.num{text-align:right}
.data-table td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.data-table td.num{text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px}
.data-table tr:hover td{background:#f8fafc}
.tbl-wrap{max-height:540px;overflow-y:auto;border-radius:8px}
.pct-bar{display:flex;align-items:center;gap:6px}
.pct-bar-track{width:60px;height:6px;background:var(--border);border-radius:3px;overflow:hidden;flex-shrink:0}
.pct-bar-fill{height:100%;border-radius:3px;background:var(--brand)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.badge.pos{background:#dcfce7;color:#15803d}.badge.neg{background:#fee2e2;color:#b91c1c}
.badge.neu{background:#f1f5f9;color:var(--text3)}.badge.warn{background:#fef3c7;color:#92400e}
.badge.crit{background:#fee2e2;color:#b91c1c}.badge.aaa{background:#1D9E75;color:#fff}
.badge.aa{background:#dcfce7;color:#15803d}.badge.b{background:#fef3c7;color:#92400e}.badge.c{background:#f1f5f9;color:#64748b}

/* RFM LEGEND */
.rfm-legend{background:var(--brand-l);border:1px solid var(--brand);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.rfm-legend-title{font-size:13px;font-weight:700;color:var(--brand-d);margin-bottom:4px}
.rfm-legend-desc{font-size:12.5px;color:var(--text2);line-height:1.5;margin-bottom:10px}
.rfm-legend-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
@media(max-width:800px){.rfm-legend-grid{grid-template-columns:1fr}}
.rfm-dim{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--text2);line-height:1.4}
.rfm-letter{flex-shrink:0;width:26px;height:26px;border-radius:6px;background:var(--brand);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.rfm-legend-segs{font-size:11.5px;color:var(--text3);border-top:1px solid rgba(29,158,117,.25);padding-top:9px;line-height:2}
body.dark-mode .rfm-legend{background:rgba(29,158,117,.12)}
body.dark-mode .rfm-legend-title{color:var(--brand)}

/* PIPELINE */
.pipe-hdr{display:flex;align-items:center;gap:11px;margin:22px 0 12px}
.pipe-hdr .num{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.pipe-hdr h2{font-size:15px;font-weight:700;color:var(--text);line-height:1.2}
.pipe-hdr p{font-size:12px;color:var(--text3);margin-top:2px;line-height:1.4}
.sub-ano{font-size:10.5px;color:var(--text3);font-weight:400;margin-top:1px}
.mixchip{display:inline-block;padding:2px 7px;border-radius:6px;background:var(--bg);border:1px solid var(--border);color:var(--text2);font-size:11px;font-weight:600;white-space:nowrap;margin:1px 0}
.mixchip.main{background:var(--brand-l);border-color:var(--brand);color:var(--brand-d)}
.mixchip.more{color:var(--text3)}
body.dark-mode .mixchip{background:rgba(255,255,255,.05)}
.act{display:inline-block;padding:3px 9px;border-radius:7px;background:var(--brand-l);color:var(--brand-d);font-size:11.5px;font-weight:600;white-space:nowrap}
.act.urgent{background:#fee2e2;color:#b91c1c}
.act.warn{background:#fef3c7;color:#92400e}
body.dark-mode .act{background:rgba(29,158,117,.18);color:#5fe0b0}
body.dark-mode .act.urgent{background:rgba(220,38,38,.2);color:#fca5a5}
body.dark-mode .act.warn{background:rgba(245,158,11,.2);color:#fcd34d}

/* CHARTS */
.chart-wrap{position:relative}
.chart-wrap.h300{height:300px}.chart-wrap.h260{height:260px}.chart-wrap.h220{height:220px}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:1100px){.chart-grid{grid-template-columns:1fr}}

/* THEME TOGGLE */
#theme-toggle{position:fixed;bottom:20px;left:20px;z-index:9999;background:var(--sidebar);color:#fff;border:none;border-radius:50%;width:42px;height:42px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,0,0,.35);transition:transform .2s}
#theme-toggle:hover{transform:scale(1.12)}
body.dark-mode{--bg:#0f1117;--white:#1e2433;--border:#2d3748;--text:#e2e8f0;--text2:#cbd5e1;--text3:#8892a4;--red:#f87171;--green:#4ade80;--amber:#fbbf24;--brand-l:#0f3d2e}
body.dark-mode #topbar{background:#1e2433}
body.dark-mode .data-table th{background:#0d1117}
body.dark-mode .data-table tr:hover td{background:#1a2236}
body.dark-mode .tb-title,body.dark-mode #page-title{color:#e2e8f0}
</style>

<body>
<button id="theme-toggle" onclick="toggleTheme()" title="Alternar tema">🌙</button>

<div id="sidebar">
  <div class="sb-logo">
    <div class="brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="26" height="26" style="margin-right:8px;flex-shrink:0"><path d="M76,26 A34,34 0 1,0 76,74" fill="none" stroke="#1D9E75" stroke-width="21" stroke-linecap="round"/><rect x="23" y="33" width="30" height="7" rx="3.5" fill="#fff"/><rect x="21" y="46" width="34" height="7" rx="3.5" fill="#fff"/><rect x="23" y="59" width="30" height="7" rx="3.5" fill="#fff"/></svg>Cabana Burger</div>

  </div>
  <div class="sb-nav">
    <div class="sb-section">Visão Geral</div>
    <div class="sb-item active" data-page="visao" onclick="showPage('visao',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/></svg>Evolução</div>
    <div class="sb-item" data-page="pedidos" onclick="showPage('pedidos',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>Pedidos &amp; Ticket</div>
    <div class="sb-section">Clientes</div>
    <div class="sb-item" data-page="frequencia" onclick="showPage('frequencia',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>Frequência</div>
    <div class="sb-item" data-page="potencial" onclick="showPage('potencial',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>Potencial (RFM)</div>
    <div class="sb-item" data-page="alertas" onclick="showPage('alertas',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>Alertas de Inativos</div>
    <div class="sb-section">Produtos &amp; Projeção</div>
    <div class="sb-item" data-page="produtos" onclick="showPage('produtos',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>Mix de Produtos</div>
    <div class="sb-item" data-page="projecao" onclick="showPage('projecao',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>Projeção do Mês</div>
    <div class="sb-section">Comercial</div>
    <div class="sb-item" data-page="pipeline" onclick="showPage('pipeline',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="7"/><rect x="12" y="6" width="3" height="11"/><rect x="17" y="13" width="3" height="4"/></svg>Pipeline de Crescimento</div>
  </div>
</div>

<div id="main">
  <div id="topbar">
    <div class="tb-title" id="page-title">Evolução das Vendas</div>
    <div class="tb-pills" id="active-pills"></div>
    <div class="tb-actions">
      <button class="btn-filter" onclick="openFilter()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        Filtros<span class="badge-cnt" id="filter-cnt" style="display:none">0</span>
      </button>
      <button class="btn-reset" onclick="resetFilters()">Limpar</button>
    </div>
  </div>
  <div id="content"></div>
</div>

<!-- FILTER PANEL -->
<div id="filter-overlay" onclick="if(event.target===this)closeFilter()">
  <div id="filter-panel">
    <div class="fp-header"><h3>Filtros</h3><button class="fp-close" onclick="closeFilter()">✕</button></div>
    <div class="fp-body">
      <div class="fp-section">
        <div class="fp-section-title">Período</div>
        <div class="date-row"><input type="date" id="f-date-start"><span>até</span><input type="date" id="f-date-end"></div>
        <div class="quick-dates" id="quick-dates"></div>
      </div>
      <div class="fp-section">
        <div class="fp-section-title">Vendedor</div>
        <div class="ms-actions"><span onclick="msAll('vend')">Todos</span><span onclick="msNone('vend')">Nenhum</span></div>
        <div class="check-list" id="f-vend"></div>
      </div>
      <div class="fp-section">
        <div class="fp-section-title">Cliente</div>
        <input class="ms-search" id="cli-search" placeholder="Buscar cliente..." oninput="renderCliList()">
        <div class="ms-actions"><span onclick="msAll('cli')">Todos</span><span onclick="msNone('cli')">Nenhum</span></div>
        <div class="check-list" id="f-cli"></div>
      </div>
    </div>
    <div class="fp-footer">
      <button class="fp-apply" onclick="applyFilter()">Aplicar</button>
      <button class="fp-reset" onclick="resetFilters();closeFilter()">Limpar</button>
    </div>

<script>
/* ============ DATA ENGINE ============ */
const PAYLOAD = JSON.parse(document.getElementById('b2b-data').textContent);
const CLIENTES = PAYLOAD.clientes, VEND = PAYLOAD.vendedores, ITEMS = PAYLOAD.items;
const ROWS = PAYLOAD.rows.map(r=>({nf:r[0],c:r[1],v:r[2],d:r[3],it:r[4],q:r[5],val:r[6],mb:r[7]}));
const TODAY = new Date('2026-06-17T00:00:00');
const ALL_DATES = ROWS.map(r=>r.d).sort();
const DMIN = ALL_DATES[0], DMAX = ALL_DATES[ALL_DATES.length-1];
let FILTER = {start:DMIN, end:DMAX, vend:new Set(VEND.map((_,i)=>i)), cli:new Set(CLIENTES.map((_,i)=>i))};

const BRL = n => 'R$ '+ Math.round(n||0).toLocaleString('pt-BR');
const BRLk = n => { n=n||0; if(Math.abs(n)>=1e6) return 'R$ '+(n/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2})+'M'; if(Math.abs(n)>=1e3) return 'R$ '+(n/1e3).toLocaleString('pt-BR',{maximumFractionDigits:0})+'k'; return 'R$ '+Math.round(n); };
const BRL2 = n => 'R$ '+ (n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const NUM = n => (n||0).toLocaleString('pt-BR');
const PCT = n => (n||0).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
const MNAMES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const ymLabel = ym => { const [y,m]=ym.split('-'); return MNAMES[+m-1]+'/'+y.slice(2); };
const fmtDate = s => { const [y,m,d]=s.split('-'); return d+'/'+m+'/'+y; };
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

function filtered(){
  return ROWS.filter(r=> r.d>=FILTER.start && r.d<=FILTER.end && FILTER.vend.has(r.v) && FILTER.cli.has(r.c));
}
function ordersOf(rows){
  const m=new Map();
  for(const r of rows){
    let o=m.get(r.nf);
    if(!o){o={nf:r.nf,c:r.c,v:r.v,d:r.d,val:0,mb:0,q:0,items:new Set()};m.set(r.nf,o);}
    o.val+=r.val;o.mb+=r.mb;o.q+=r.q;o.items.add(r.it);
  }
  return [...m.values()];
}
function monthsRange(start,end){
  const out=[]; let [y,m]=start.split('-').map(Number); const [ey,em]=end.split('-').map(Number);
  while(y<ey||(y===ey&&m<=em)){ out.push(y+'-'+String(m).padStart(2,'0')); m++; if(m>12){m=1;y++;} }
  return out;
}

/* ============ NAV / THEME ============ */
let charts={};
function destroyCharts(){ Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}}); charts={}; }
const PAGE_TITLES={visao:'Evolução das Vendas',pedidos:'Pedidos & Ticket Médio',frequencia:'Frequência de Compra',potencial:'Potencial de Clientes (RFM)',alertas:'Alertas de Clientes Inativos',produtos:'Mix de Produtos',projecao:'Projeção do Mês Corrente',pipeline:'Pipeline de Crescimento'};
let CURRENT='visao';
function showPage(p,el){
  CURRENT=p;
  document.querySelectorAll('.sb-item').forEach(i=>i.classList.remove('active'));
  if(el)el.classList.add('active');
  document.getElementById('page-title').textContent=PAGE_TITLES[p];
  render();
}
function toggleTheme(){ document.body.classList.toggle('dark-mode'); document.getElementById('theme-toggle').textContent=document.body.classList.contains('dark-mode')?'☀️':'🌙'; render(); }

/* ============ FILTER UI ============ */
let tmpVend, tmpCli;
function openFilter(){
  document.getElementById('f-date-start').value=FILTER.start;
  document.getElementById('f-date-end').value=FILTER.end;
  tmpVend=new Set(FILTER.vend); tmpCli=new Set(FILTER.cli);
  renderVendList(); renderCliList();
  document.getElementById('filter-overlay').classList.add('open');
}
function closeFilter(){ document.getElementById('filter-overlay').classList.remove('open'); }
function renderVendList(){
  document.getElementById('f-vend').innerHTML=VEND.map((v,i)=>
    `<label class="check-item"><input type="checkbox" ${tmpVend.has(i)?'checked':''} onchange="tglVend(${i},this.checked)">${v}</label>`).join('');
}
function tglVend(i,ck){ ck?tmpVend.add(i):tmpVend.delete(i); }
function renderCliList(){
  const q=(document.getElementById('cli-search').value||'').toLowerCase();
  document.getElementById('f-cli').innerHTML=CLIENTES.map((c,i)=>({c,i}))
    .filter(o=>o.c.toLowerCase().includes(q))
    .map(o=>`<label class="check-item"><input type="checkbox" ${tmpCli.has(o.i)?'checked':''} onchange="tglCli(${o.i},this.checked)">${o.c}</label>`).join('');
}
function tglCli(i,ck){ ck?tmpCli.add(i):tmpCli.delete(i); }
function msAll(t){ if(t==='vend'){tmpVend=new Set(VEND.map((_,i)=>i));renderVendList();}else{tmpCli=new Set(CLIENTES.map((_,i)=>i));renderCliList();} }
function msNone(t){ if(t==='vend'){tmpVend=new Set();renderVendList();}else{tmpCli=new Set();renderCliList();} }
function applyFilter(){
  FILTER.start=document.getElementById('f-date-start').value||DMIN;
  FILTER.end=document.getElementById('f-date-end').value||DMAX;
  if(tmpVend) FILTER.vend=new Set(tmpVend);
  if(tmpCli) FILTER.cli=new Set(tmpCli);
  closeFilter(); render();
}
function resetFilters(){
  FILTER={start:DMIN,end:DMAX,vend:new Set(VEND.map((_,i)=>i)),cli:new Set(CLIENTES.map((_,i)=>i))};
  tmpVend=null;tmpCli=null; render();
}
function quickRange(months){
  if(months>900){FILTER.start=DMIN;FILTER.end=DMAX;}
  else{ let d=new Date(DMAX); d.setMonth(d.getMonth()-months+1); d.setDate(1); FILTER.start=d.toISOString().slice(0,10); FILTER.end=DMAX; }
  document.getElementById('f-date-start').value=FILTER.start;document.getElementById('f-date-end').value=FILTER.end;
}
function renderPills(){
  const p=[];
  p.push(`<span class="active-pill">${fmtDate(FILTER.start)} – ${fmtDate(FILTER.end)}</span>`);
  if(FILTER.vend.size<VEND.length) p.push(`<span class="active-pill">${FILTER.vend.size} vendedor(es)</span>`);
  if(FILTER.cli.size<CLIENTES.length) p.push(`<span class="active-pill">${FILTER.cli.size} cliente(s)</span>`);
  document.getElementById('active-pills').innerHTML=p.join('');
  let cnt=(FILTER.vend.size<VEND.length?1:0)+(FILTER.cli.size<CLIENTES.length?1:0);
  const b=document.getElementById('filter-cnt'); if(cnt){b.style.display='flex';b.textContent=cnt;}else b.style.display='none';
}
document.getElementById('quick-dates').innerHTML=
  [['3M',3],['6M',6],['12M',12],['Tudo',999]].map(([l,m])=>`<span class="quick-btn" onclick="quickRange(${m});">${l}</span>`).join('');

/* chart theme helpers */
function gridColor(){ return document.body.classList.contains('dark-mode')?'rgba(255,255,255,.08)':'rgba(0,0,0,.06)'; }
function tickColor(){ return document.body.classList.contains('dark-mode')?'#8892a4':'#5a6578'; }
const PALETTE=['#1D9E75','#2563eb','#f4a261','#8b5cf6','#e63946','#16a34a','#0891b2','#db2777','#ca8a04','#475569'];
function baseOpts(extra){ return Object.assign({responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:tickColor(),font:{family:'DM Sans',size:11}}}},scales:{x:{grid:{color:gridColor()},ticks:{color:tickColor(),font:{size:10}}},y:{grid:{color:gridColor()},ticks:{color:tickColor(),font:{size:10}}}}},extra||{}); }
/* === Rótulos de dados (datalabels) === */
if(window.ChartDataLabels){ Chart.register(ChartDataLabels); Chart.defaults.set('plugins.datalabels',{display:false}); }
function DL(fmt,opts){return Object.assign({display:'auto',clamp:true,clip:false,color:tickColor(),font:{family:'DM Sans',weight:'700',size:9},formatter:(v,c)=>{if(v==null||v===0||v==='')return '';return fmt(v,c);}},opts||{});}
const dlNumTop=()=>DL(v=>NUM(Math.round(v)),{anchor:'end',align:'top'});
const dlBrlTop=()=>DL(v=>BRLk(v),{anchor:'end',align:'top'});
const dlBrlIn=()=>DL(v=>BRLk(v),{anchor:'end',align:'left',color:'#fff'});
const dlPie=()=>({display:'auto',color:'#fff',font:{family:'DM Sans',weight:'700',size:11},formatter:(v,ctx)=>{const t=ctx.dataset.data.reduce((a,b)=>a+(b||0),0);const p=t?v/t*100:0;return p<5?'':Math.round(p)+'%';}});

/* ============ RENDER DISPATCH ============ */
let pageState={visaoMetric:'val'};
function render(){
  renderPills(); destroyCharts();
  const fr=filtered();
  const fns={visao:renderVisao,pedidos:renderPedidos,frequencia:renderFrequencia,potencial:renderPotencial,alertas:renderAlertas,produtos:renderProdutos,projecao:renderProjecao,pipeline:renderPipeline};
  (fns[CURRENT]||renderVisao)(fr);
}
</script>
<script id="pages-js">/* ============================================================
   PÁGINAS — renderização de cada indicador
   ============================================================ */
const C = () => document.getElementById('content');

/* helper: KPI card */
function kpi(label,value,sub,cls,color){
  return `<div class="kpi-card ${color||'c-grn'}"><div class="k-label">${label}</div><div class="k-value">${value}</div>${sub?`<div class="k-sub ${cls||''}">${sub}</div>`:''}</div>`;
}
function deltaStr(cur,prev){
  if(prev===0||prev==null) return ['—','neu'];
  const d=(cur-prev)/Math.abs(prev)*100;
  return [(d>=0?'▲ ':'▼ ')+Math.abs(d).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%', d>=0?'pos':'neg'];
}

/* monthly aggregation from rows */
function monthly(rows){
  const orders=ordersOf(rows);
  const months=monthsRange((FILTER.start).slice(0,7),(FILTER.end).slice(0,7));
  const m={}; months.forEach(k=>m[k]={val:0,mb:0,pedidos:0,cli:new Set(),q:0});
  for(const r of rows){ const k=r.d.slice(0,7); if(m[k]){m[k].val+=r.val;m[k].mb+=r.mb;m[k].q+=r.q;} }
  for(const o of orders){ const k=o.d.slice(0,7); if(m[k]){m[k].pedidos++;m[k].cli.add(o.c);} }
  return {months,m};
}

/* ============ 1-3,6 EVOLUÇÃO (Visão) ============ */
function renderVisao(rows){
  const orders=ordersOf(rows);
  const totVal=rows.reduce((s,r)=>s+r.val,0);
  const totMB=rows.reduce((s,r)=>s+r.mb,0);
  const nPed=orders.length;
  const nCli=new Set(rows.map(r=>r.c)).size;
  const ticket= nPed? totVal/nPed : 0;
  const mbPct= totVal? totMB/totVal*100 : 0;
  const {months,m}=monthly(rows);
  // delta last full month vs previous
  let kpiDelta='';
  if(months.length>=2){
    const cur=m[months[months.length-1]].val, prev=m[months[months.length-2]].val;
    const [s,c]=deltaStr(cur,prev); kpiDelta=`<div class="k-sub ${c}">${s} vs mês ant.</div>`;
  }
  C().innerHTML=`
  <div class="page-intro">Evolução de vendas, clientes ativos e pedidos ao longo do tempo. Use os filtros para recortar por período, vendedor ou cliente.</div>
  <div class="kpi-grid">
    ${kpi('Vendas no período',BRL(totVal),null,null,'c-grn')}
    ${kpi('Margem Bruta',BRL(totMB),PCT(mbPct)+' da venda','neu','c-blu')}
    ${kpi('Pedidos',NUM(nPed),null,null,'c-amb')}
    ${kpi('Clientes ativos',NUM(nCli),null,null,'c-pur')}
    ${kpi('Ticket médio / pedido',BRL(ticket),null,null,'c-red')}
  </div>

/* ============ 5 FREQUÊNCIA POR CLIENTE ============ */
function clienteStats(rows){
  // por cliente: pedidos (NF únicos), datas, total, intervalo médio
  const orders=ordersOf(rows);
  const byC={};
  for(const o of orders){
    if(!byC[o.c]) byC[o.c]={c:o.c,dates:[],val:0,nped:0,mb:0,vendVal:{}};
    byC[o.c].dates.push(o.d); byC[o.c].val+=o.val; byC[o.c].nped++; byC[o.c].mb+=o.mb;
    byC[o.c].vendVal[o.v]=(byC[o.c].vendVal[o.v]||0)+o.val;
  }
  const out=[];
  for(const k in byC){
    const s=byC[k]; s.dates.sort();
    const first=s.dates[0], last=s.dates[s.dates.length-1];
    let avgInt=null;
    if(s.dates.length>=2){
      let tot=0; for(let i=1;i<s.dates.length;i++) tot+=daysBetween(s.dates[i-1],s.dates[i]);
      avgInt=tot/(s.dates.length-1);
    }
    const span=daysBetween(first,last);
    const freqMes = span>0 ? s.nped/(span/30) : null;
    const recencia=daysBetween(last, FILTER.end);
    const vendId=Object.keys(s.vendVal).sort((a,b)=>s.vendVal[b]-s.vendVal[a])[0];
    const vendNome=VEND[vendId];
    out.push({c:s.c,nome:CLIENTES[s.c],nped:s.nped,val:s.val,mb:s.mb,ticket:s.val/s.nped,first,last,avgInt,freqMes,recencia,vendId,vendNome});
  }
  return out;
}

/* ============ 8 POTENCIAL RFM ============ */
function scoreQuintile(arr,val,invert){
  // returns 1-5; invert=true means lower value = higher score (for recency)
  const sorted=[...arr].sort((a,b)=>a-b);
  const rank=sorted.filter(x=>x<=val).length/sorted.length; // 0..1
  let s=Math.ceil(rank*5); if(s<1)s=1; if(s>5)s=5;
  return invert? 6-s : s;
}
function rfmData(rows){
  const stats=clienteStats(rows);
  const recs=stats.map(s=>s.recencia), freqs=stats.map(s=>s.nped), vals=stats.map(s=>s.val);
  stats.forEach(s=>{
    s.R=scoreQuintile(recs,s.recencia,true);
    s.F=scoreQuintile(freqs,s.nped,false);
    s.M=scoreQuintile(vals,s.val,false);
    s.score=s.R+s.F+s.M;
    // segmento
    if(s.score>=13) s.seg=['Campeão','aaa'];
    else if(s.score>=11) s.seg=['Fiel','aa'];
    else if(s.F>=4&&s.R<=2) s.seg=['Em risco','crit'];
    else if(s.R>=4&&s.F<=2) s.seg=['Novo / Promissor','b'];
    else if(s.score>=8) s.seg=['Potencial','b'];
    else s.seg=['Baixo engajamento','c'];
  });
  return stats;
}

/* ============ 9 ALERTAS DE INATIVOS ============ */
function renderAlertas(rows){
  // usar histórico do cliente (filtro de período aplicado). Inativo = recência > intervalo médio × fator
  const factor = pageState.alertFactor || 2;
  const stats=clienteStats(rows);
  const alerts=stats.filter(s=>{
    if(s.avgInt==null) return s.recencia>90; // só 1 compra: alerta se >90d
    return s.recencia > s.avgInt*factor;
  }).map(s=>{
    const esperado = s.avgInt!=null? s.avgInt*factor : 90;
    s.atraso = s.recencia - esperado;
    s.nivel = s.recencia > (s.avgInt!=null? s.avgInt*factor*2 : 180) ? ['Crítico','crit'] : ['Atenção','warn'];
    return s;
  }).sort((a,b)=>b.val-a.val);
  const valEmRisco=alerts.reduce((x,s)=>x+s.val,0);
  C().innerHTML=`
  <div class="page-intro">Clientes que ultrapassaram seu próprio ritmo de compra. <b>Inativo</b> = dias desde a última compra maior que (intervalo médio do cliente × fator). Clientes com 1 só compra usam corte de 90 dias.</div>
  <div class="kpi-grid">
    ${kpi('Clientes em alerta',NUM(alerts.length),null,null,'c-red')}
    ${kpi('Receita histórica em risco',BRL(valEmRisco),'soma dos clientes em alerta','neg','c-amb')}
    ${kpi('Críticos',NUM(alerts.filter(a=>a.nivel[0]==='Crítico').length),null,null,'c-red')}

  <div class="card">
    <div class="card-header"><div class="card-title">Sensibilidade do alerta</div>
      <div class="var-btns">
        <button class="var-btn ${factor===1.5?'active':''}" onclick="setFactor(1.5)">1,5×</button>
        <button class="var-btn ${factor===2?'active':''}" onclick="setFactor(2)">2×</button>
        <button class="var-btn ${factor===3?'active':''}" onclick="setFactor(3)">3×</button>
      </div></div>
    <div class="card-body"><div class="tbl-wrap"><table class="data-table">
      <thead><tr><th>Cliente</th><th>Nível</th><th class="num">Dias s/ comprar</th><th class="num">Interv. médio</th><th class="num">Atraso</th><th class="num">Pedidos</th><th class="num">Total histórico</th><th class="num">Última compra</th></tr></thead>
      <tbody>${alerts.map(s=>`<tr>
        <td>${s.nome}</td>
        <td><span class="badge ${s.nivel[1]}">${s.nivel[0]}</span></td>
        <td class="num"><b>${s.recencia}d</b></td>

/* ============ PIPELINE DE CRESCIMENTO (CRM analítico) ============ */
function addMonthsISO(iso,n){const d=new Date(iso);d.setMonth(d.getMonth()+n);return d.toISOString().slice(0,10);}
function catProd(n){n=(n||'').toUpperCase();
  if(n.includes('HAMBURG')||n.includes('SMASH')||n.includes('BURGUER')||n.includes('BURGER'))return 'Hambúrguer';
  if(n.includes('BACON')||n.includes('FILE')||n.includes('FILÉ')||n.includes('ACEM')||n.includes('COSTELA')||n.includes('CARNE')||n.includes('LINGUI')||n.includes('FRANGO')||n.includes('MIGNON'))return 'Carnes & Frios';
  if(n.includes('QUEIJO')||n.includes('CHEDDAR'))return 'Queijos';
  if(n.includes('MAIONESE')||n.includes('MOLHO')||n.includes('RANCH')||n.includes('KETCHUP')||n.includes('BARBE')||n.includes('XAROPE'))return 'Molhos & Toppings';
  if(n.includes('SORVETE')||n.includes('GELATO')||n.includes('BISCOFF'))return 'Sobremesas';
  if(n.includes('FREEZER')||n.includes('CHAPA')||n.includes('EQUIP'))return 'Equipamentos';
  if(n.includes('OLEO')||n.includes('ÓLEO')||n.includes('BATATA')||n.includes('PAO')||n.includes('PÃO'))return 'Insumos';
  return 'Outros';}

function renderPipeline(){
  const base=ROWS.filter(r=>FILTER.vend.has(r.v)&&FILTER.cli.has(r.c));
  const ref=DMAX, cut12=addMonthsISO(DMAX,-12);
  const M=new Map();
  for(const r of base){
    let o=M.get(r.c);
    if(!o){o={c:r.c,nome:CLIENTES[r.c],valTot:0,mbTot:0,val12:0,mb12:0,ords:new Map(),prods:new Set(),prods12:new Set(),vendVal:{}};M.set(r.c,o);}
    o.valTot+=r.val;o.mbTot+=r.mb;o.prods.add(r.it);
    o.vendVal[r.v]=(o.vendVal[r.v]||0)+r.val;
    if(!o.ords.has(r.nf))o.ords.set(r.nf,r.d);
    if(r.d>=cut12){o.val12+=r.val;o.mb12+=r.mb;o.prods12.add(r.it);}
  }
  const cli=[...M.values()];
  if(!cli.length){C().innerHTML='<div class="page-intro">Nenhum cliente no recorte atual de filtros.</div>';return;}
  cli.forEach(o=>{
    const dates=[...new Set([...o.ords.values()])].sort();
    o.nped=o.ords.size; o.first=dates[0]; o.last=dates[dates.length-1];
    o.recencia=daysBetween(o.last,ref);
    let ai=null;
    if(dates.length>=2){let t=0;for(let i=1;i<dates.length;i++)t+=daysBetween(dates[i-1],dates[i]);ai=t/(dates.length-1);}
    o.avgInt=ai;
    const span=Math.max(daysBetween(o.first,o.last),30);
    o.freqMes=o.nped/(span/30);
    o.ticket=o.valTot/o.nped;
    const o12=[...o.ords.values()].filter(d=>d>=cut12);
    o.nped12=o12.length;
    o.ticket12=o.nped12?o.val12/o.nped12:0;
    o.freqMes12=o.nped12/12;
    o.vendNome=VEND[Object.keys(o.vendVal).sort((a,b)=>o.vendVal[b]-o.vendVal[a])[0]];
  });
  // RFM
  const recs=cli.map(o=>o.recencia),freqs=cli.map(o=>o.nped),vals=cli.map(o=>o.valTot);
  cli.forEach(o=>{
    o.R=scoreQuintile(recs,o.recencia,true); o.F=scoreQuintile(freqs,o.nped,false); o.Mn=scoreQuintile(vals,o.valTot,false);
    o.score=o.R+o.F+o.Mn;
    if(o.score>=13)o.seg=['Campeão','aaa'];
    else if(o.score>=11)o.seg=['Fiel','aa'];
    else if(o.F>=4&&o.R<=2)o.seg=['Em risco','crit'];
    else if(o.R>=4&&o.F<=2)o.seg=['Novo/Promissor','b'];
    else if(o.score>=8)o.seg=['Potencial','b'];
    else o.seg=['Baixo engajamento','c'];
  });

  /* BLOCO 1 — recuperação */
  const maxVal=Math.max(...vals,1), maxMB=Math.max(...cli.map(o=>o.mbTot),1);
  cli.forEach(o=>{
    const ratio=o.avgInt? o.recencia/o.avgInt : (o.recencia/45);
    o.ratio=ratio;
    if(ratio<=1)o.nivel=['Saudável','pos'];
    else if(ratio<=2)o.nivel=['Atenção','warn'];
    else if(ratio<=3.5)o.nivel=['Em risco','neg'];
    else o.nivel=['Crítico','crit'];
    const rec=o.valTot/maxVal, mar=o.mbTot/maxMB, rfm=o.score/15, atraso=Math.min(ratio/4,1);
    o.prio=Math.round((rec*0.4+mar*0.2+rfm*0.15+atraso*0.25)*100);
  });
  const emRisco=cli.filter(o=>o.nivel[0]==='Em risco'||o.nivel[0]==='Crítico');
  const receitaRisco=emRisco.reduce((s,o)=>s+o.valTot,0);
  const top20risco=[...cli].sort((a,b)=>b.prio-a.prio).slice(0,20);
  const acaoRisco=o=>o.nivel[0]==='Crítico'?['Recuperar cliente — contato imediato','urgent']
    :o.nivel[0]==='Em risco'?['Ligar para o cliente','warn']
    :o.nivel[0]==='Atenção'?['Agendar visita / follow-up','']:['Manter relacionamento',''];

  /* BLOCO 2 — white space (potencial INDIVIDUALIZADO) */
  const ativos=cli.filter(o=>o.val12>0);
  const tks=ativos.map(o=>o.ticket12).sort((a,b)=>a-b);
  const quartil=v=>{const r=tks.filter(x=>x<=v).length/(tks.length||1);return Math.min(3,Math.floor(r*4));};
  const grupos={0:[],1:[],2:[],3:[]};
  ativos.forEach(o=>{o.grp=quartil(o.ticket12);grupos[o.grp].push(o.freqMes12);});
  const p75=arr=>{if(!arr.length)return 0;const s=[...arr].sort((a,b)=>a-b);return s[Math.min(s.length-1,Math.floor(s.length*0.75))];};
  const benchFreq={0:p75(grupos[0]),1:p75(grupos[1]),2:p75(grupos[2]),3:p75(grupos[3])};
  const UPLIFT_CAP=3;   // potencial no máx. 3x a receita atual (crescimento realista)
  ativos.forEach(o=>{
    const potAnual=benchFreq[o.grp]*o.ticket12*12;        // freq típica dos pares x ticket do PRÓPRIO cliente
    o.potencial=Math.max(o.val12, Math.min(potAnual, o.val12*UPLIFT_CAP));
    o.gap=o.potencial-o.val12;
    o.captura=o.potencial>0?o.val12/o.potencial:1;
    o.benchFreq=benchFreq[o.grp];
  });
  const recAtual=ativos.reduce((s,o)=>s+o.val12,0);
  const recPot=ativos.reduce((s,o)=>s+o.potencial,0);
  const naoCapturado=ativos.reduce((s,o)=>s+o.gap,0);
  const topGap=[...ativos].filter(o=>o.gap>0).sort((a,b)=>b.gap-a.gap).slice(0,20);
  const acaoPot=o=>o.freqMes12<o.benchFreq*0.7?['Aumentar frequência de pedidos','warn']:o.captura<0.6?['Negociar aumento de volume','']:['Revisar mix e ampliar pedidos',''];

  /* BLOCO 3 — cross-sell por LINHA DE PRODUTO, comparando com PARES (mesmo porte/ticket) */
  const cats=[...new Set(ITEMS.map(n=>catProd(n)))];
  // mix atual (receita por linha em 12m) de cada cliente
  ativos.forEach(o=>{o.catVal={};});
  base.forEach(r=>{if(r.d>=cut12){const o=M.get(r.c); if(o&&o.val12>0){const c=catProd(ITEMS[r.it]); o.catVal[c]=(o.catVal[c]||0)+r.val;}}});
  ativos.forEach(o=>{o.ocats=new Set(Object.keys(o.catVal)); o.mixSorted=Object.keys(o.catVal).sort((a,b)=>o.catVal[b]-o.catVal[a]);});
  // grupos de pares = mesmos quartis de ticket do Bloco 2 (o.grp)
  const gSize={0:0,1:0,2:0,3:0}, gBuyers={0:{},1:{},2:{},3:{}}, gRev={0:{},1:{},2:{},3:{}}, gMed={};
  ativos.forEach(o=>{gSize[o.grp]++; o.ocats.forEach(c=>{gBuyers[o.grp][c]=(gBuyers[o.grp][c]||0)+1;}); Object.keys(o.catVal).forEach(c=>{gRev[o.grp][c]=(gRev[o.grp][c]||0)+o.catVal[c];});});
  [0,1,2,3].forEach(g=>{const s=ativos.filter(o=>o.grp===g).map(o=>o.val12).sort((a,b)=>a-b);gMed[g]=s.length?(s[Math.floor(s.length/2)]||1):1;});
  const PEN_MIN=0.30;
  const cross=[];
  ativos.forEach(o=>{
    const g=o.grp, gs=gSize[g]||1, sizeF=Math.max(0.3,Math.min(3,o.val12/(gMed[g]||1)));
    cats.forEach(c=>{
      if(o.ocats.has(c))return;
      const b=gBuyers[g][c]||0, pen=b/gs;
      if(b===0||pen<PEN_MIN)return;
      const avgBuyer=gRev[g][c]/b;
      if(avgBuyer<=0)return;
      const recPotP=avgBuyer*sizeF;
      cross.push({nome:o.nome,vend:o.vendNome,prod:c,pen:pen,recPot:recPotP,prio:pen*recPotP,mix:o.mixSorted});
    });
  });
  cross.sort((a,b)=>b.prio-a.prio);
  const crossTotal=cross.reduce((s,x)=>s+x.recPot,0);
  const maxCrossPrio=Math.max(...cross.map(x=>x.prio),1);
  const topCross=cross.slice(0,25);
  const prioLabel=x=>{const r=x.prio/maxCrossPrio;return r>=0.5?['Alta','crit']:r>=0.2?['Média','warn']:['Baixa','c'];};

  const oportTotal=receitaRisco+naoCapturado+crossTotal;

  // ====== HTML ======
  const linhasRisco=top20risco.map(o=>{const a=acaoRisco(o);return `<tr>
    <td>${o.nome}</td><td>${o.vendNome}</td>
    <td><span class="badge ${o.seg[1]}">${o.seg[0]}</span></td>
    <td class="num">${fmtDate(o.last)}</td>
    <td class="num"><b>${o.recencia}d</b></td>
    <td class="num">${o.avgInt!=null?'a cada '+Math.round(o.avgInt)+'d':'1 compra'}</td>
    <td class="num">${BRL(o.val12)}</td>
    <td class="num">${BRL(o.mb12)}</td>
    <td><span class="badge ${o.nivel[1]}">${o.nivel[0]}</span></td>
    <td class="num"><b>${o.prio}</b></td>
    <td><span class="act ${a[1]}">${a[0]}</span></td></tr>`;}).join('');

  const linhasPot=topGap.map(o=>{const a=acaoPot(o);return `<tr>
    <td>${o.nome}</td><td>${o.vendNome}</td>
    <td class="num">${BRL(o.val12/12)}<div class="sub-ano">${BRL(o.val12)}/ano</div></td>
    <td class="num">${BRL(o.potencial/12)}<div class="sub-ano">${BRL(o.potencial)}/ano</div></td>
    <td class="num"><b>${BRL(o.gap/12)}</b><div class="sub-ano">${BRL(o.gap)}/ano</div></td>
    <td class="num">${PCT(o.captura*100)}</td>
    <td><span class="act ${a[1]}">${a[0]}</span></td></tr>`;}).join('');

  const chipsMix=mix=>mix.slice(0,3).map((c,i)=>`<span class="mixchip${i===0?' main':''}">${c}</span>`).join(' ')+(mix.length>3?` <span class="mixchip more">+${mix.length-3}</span>`:'');
  const linhasCross=topCross.map(x=>{const pl=prioLabel(x);return `<tr>
    <td>${x.nome}</td><td>${x.vend}</td>
    <td>${chipsMix(x.mix)}</td>
    <td>${x.prod}</td>
    <td class="num">${PCT(x.pen*100)}</td>
    <td class="num">${BRL(x.recPot/12)}<div class="sub-ano">${BRL(x.recPot)}/ano</div></td>
    <td><span class="badge ${pl[1]}">${pl[0]}</span></td>
    <td><span class="act">Apresentar linha: ${x.prod}</span></td></tr>`;}).join('');

  C().innerHTML=`
  <div class="page-intro">CRM analítico: lista priorizada de oportunidades comerciais. Cruza RFM, frequência, recência, receita e mix para indicar <b>quem trabalhar</b> e <b>qual ação executar</b>. Respeita os filtros de vendedor/cliente; o filtro de data é ignorado (usa todo o histórico, janela de 12 meses até ${fmtDate(DMAX)}).</div>

  <div class="kpi-grid">
    ${kpi('Receita em risco (12m)',BRL(receitaRisco),emRisco.length+' clientes Em risco/Crítico','neg','c-red')}
    ${kpi('Potencial de carteira / mês',BRL(naoCapturado/12),BRL(naoCapturado)+' /ano','neu','c-grn')}
    ${kpi('Potencial de cross-sell / mês',BRL(crossTotal/12),BRL(crossTotal)+' /ano · '+cross.length+' oport.','neu','c-blu')}
    ${kpi('Oportunidade total / ano',BRL(oportTotal),'risco + carteira + cross-sell (anual)','neu','c-pur')}
  </div>
  <div class="page-intro" style="margin-top:-6px">Carteira e cross-sell são exibidos em <b>média mensal</b> (com o anual ao lado); recuperação e "receita em risco" ficam em base de 12 meses. A "Oportunidade total" é uma referência anual consolidada — use cada bloco para a leitura precisa.</div>

  <div class="pipe-hdr"><div class="num">1</div><div><h2>Priorização de recuperação</h2><p>Clientes valiosos perdendo frequência — ordenados por score de prioridade (receita, margem, RFM e atraso no ciclo).</p></div></div>
  <div class="card"><div class="card-header"><div class="card-title">Top 20 — maior risco de perda de receita</div><span class="card-sub">Receita em risco: ${BRL(receitaRisco)}</span></div>
    <div class="card-body"><div class="tbl-wrap"><table class="data-table">
      <thead><tr><th>Cliente</th><th>Vendedor</th><th>Segmento</th><th class="num">Última compra</th><th class="num">Dias s/ comprar</th><th class="num">Freq. média</th><th class="num">Receita 12m</th><th class="num">Margem 12m</th><th>Nível</th><th class="num">Prioridade</th><th>Ação recomendada</th></tr></thead>
      <tbody>${linhasRisco}</tbody>
    </table></div></div></div>

  <div class="pipe-hdr"><div class="num">2</div><div><h2>Potencial de carteira (white space)</h2><p>Clientes que compram abaixo do benchmark de pares (mesma faixa de ticket). Gap = potencial anual − receita 12m.</p></div></div>
  <div class="kpi-grid">
    ${kpi('Receita atual / mês',BRL(recAtual/12),BRL(recAtual)+' /ano','neu','c-blu')}
    ${kpi('Receita potencial / mês',BRL(recPot/12),BRL(recPot)+' /ano','neu','c-grn')}
    ${kpi('Potencial não capturado / mês',BRL(naoCapturado/12),BRL(naoCapturado)+' /ano · '+PCT(recPot>0?naoCapturado/recPot*100:0)+' da carteira','neu','c-amb')}
  </div>
  <div class="card"><div class="card-header"><div class="card-title">Receita atual vs. potencial (média mensal) — top 12 por gap</div></div>
    <div class="card-body"><div class="chart-wrap h300"><canvas id="ch-pipe-pot"></canvas></div></div></div>
  <div class="card"><div class="card-header"><div class="card-title">Top oportunidades de crescimento</div><span class="card-sub">ordenado por gap de receita</span></div>
    <div class="card-body"><div class="tbl-wrap"><table class="data-table">
      <thead><tr><th>Cliente</th><th>Vendedor</th><th class="num">Receita atual / mês</th><th class="num">Potencial / mês</th><th class="num">Gap / mês</th><th class="num">% captura</th><th>Ação recomendada</th></tr></thead>
      <tbody>${linhasPot}</tbody>
    </table></div></div></div>

  <div class="pipe-hdr"><div class="num">3</div><div><h2>Oportunidades de cross-sell</h2><p>Linhas com alta penetração entre <b>clientes do mesmo porte (faixa de ticket)</b> que o cliente ainda não compra. A coluna "Compra hoje" mostra o que ele já leva (principal em destaque). Receita potencial = média por comprador dos pares, ajustada ao porte do cliente.</p></div></div>
  <div class="card"><div class="card-header"><div class="card-title">Top oportunidades de cross-sell</div><span class="card-sub">Potencial: ${BRL(crossTotal/12)}/mês · ${BRL(crossTotal)}/ano</span></div>
    <div class="card-body"><div class="tbl-wrap"><table class="data-table">
      <thead><tr><th>Cliente</th><th>Vendedor</th><th>Compra hoje</th><th>Linha sugerida</th><th class="num">Penetração nos pares</th><th class="num">Receita potencial / mês</th><th>Prioridade</th><th>Ação recomendada</th></tr></thead>
      <tbody>${linhasCross}</tbody>
    </table></div></div></div>
  `;

  const cd=topGap.slice(0,12).reverse();
  charts.pipePot=new Chart(document.getElementById('ch-pipe-pot'),{type:'bar',data:{labels:cd.map(o=>o.nome.length>26?o.nome.slice(0,26)+'…':o.nome),datasets:[
    {label:'Receita atual / mês',data:cd.map(o=>Math.round(o.val12/12)),backgroundColor:PALETTE[1],borderRadius:4},
    {label:'Potencial / mês',data:cd.map(o=>Math.round(o.potencial/12)),backgroundColor:PALETTE[0],borderRadius:4}
  ]},options:baseOpts({indexAxis:'y',plugins:{legend:{labels:{color:tickColor(),font:{family:'DM Sans',size:11}}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+BRL(c.parsed.x)}}},scales:{x:{grid:{color:gridColor()},ticks:{color:tickColor(),font:{size:9},callback:v=>BRLk(v)}},y:{grid:{display:false},ticks:{color:tickColor(),font:{size:9}}}}})});
}
</script>
<script>window.addEventListener('DOMContentLoaded',()=>render());</script>
</body>
</html>
